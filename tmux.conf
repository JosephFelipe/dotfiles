set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

##### Troca o prefixo para Ctrl + a #####
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
#########################################

##### Troca as chamadas de terminal horizontal e vertical #####
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"
##########################################

###### Utiliza o r para chamar o source do tmux ######
unbind r
bind r source-file ~/.tmux.conf

##### Atalhos para redimensionar painéis #####
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
##########################################

##### Ativa o mouse #####
set -g mouse on
##########################################

##### Personalização da Barra de Status (Interface) #####
set -g status-interval 1
set-option -g status-position bottom
set -g status-bg "#1e1e2e"
set -g status-fg white

set -g status-left-length 50
set -g status-left "#[fg=#a6e3a1,bg=#1e1e2e,bold]  Sessão: #S #[fg=#6c7086] | "

set -g status-right-length 100
set -g status-right "#[fg=#89dceb] 󰃭 %d/%m/%Y #[fg=#6c7086]| #[fg=#f9e2af]󱑒 %H:%M:%S #[fg=#6c7086]| #[fg=#f38ba8,bold] #H "

set -g status-justify centre
set -g window-status-format "#[fg=#cdd6f4]  #I:#W "
set -g window-status-current-format "#[fg=#fab387,bold]  #I:#W "
##########################################################

##### Configuração da Borda dos Painéis #####
set -g pane-border-status top
set -g pane-border-lines double
set -g pane-border-format "==|#{pane_index}. #{pane_current_command} @ #{pane_current_path}|=="
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
##########################################################

##### Gerenciador de Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'

# Inicializa o gerenciador de plugins (Esta linha DEVE ficar no final do arquivo)
run '~/.tmux/plugins/tpm/tpm'
